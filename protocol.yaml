# DRAFT protocol. Freeze (git tag protocol-v1) only after the week-1 reading gate and pilot calibration.
status: draft
global_seed: 0
budgets: [0.05, 0.10, 0.15, 0.20, 0.30, 0.40, 0.50, 0.70]
methods: [W, DF, NC, SMDS, HSS, wEffRes]
nulls: [R-U, R-W]
null_draws: 20
proximity: jaccard          # p_ij = w_ij / (s_i + s_j - w_ij); alternative for E5: max
si:
  half_infection_target: 20
  seed_fraction_each_tier: 0.05   # top / median / bottom eigenvector centrality
  runs_per_seed: 100
  runs_per_seed_null: 20
louvain: {resolution: 1.0, seeds: 20}
paths: {epsilon: 0.1}
thresholds:                 # calibrated on the 15 pilot synthetic networks only (scripts/pilot_thresholds.py, quick config)
  tau_s: 0.8                # pilot: failure rate 25.6% over all cells (spread 36.5%, path 23.9%, comm 23.1%, rank 19.0%)
  tau_f: 0.6                # rule: keep defaults if the pilot failure rate lies in 5%-50%; it does, so defaults stand
  pilot_note: "pilot F_struct median 0.98 (10th pct 0.83): the structural check rarely rejects a backbone on these networks" 
validation:
  netbone_min_jaccard: 0.9  # DF, NC (exact variant), HSS correlation > 0.98
hypotheses:   # H1-H3 are the paper's hypotheses; RQ entries answer its research questions without a stated direction
  H1: "contact networks: SMDS and HSS have a smaller gap and higher skill on spreading than W and DF (paired Wilcoxon, Holm)"
  H2: "contact networks: F_comm of SMDS at the metric-backbone size has bootstrap CI lower limit >= tau_f"
  H3: "bridge_ratio predicts gap on spreading and communities (sign, Holm, LRT) - associational on real networks"
  RQ1: "Kendall tau-b (F_struct vs F_g method ranking) mean and CI upper limit < 0.6 for >= 2 of 4 functions"
  RQ3: "synthetic: method x (weight spread | coupling) interaction CI excludes 0, W/DF degrade more than SMDS"
  RQ4: "in > 50% of cells at least two functions have different best methods (CI lower limit > 0.5)"
multiple_testing: {method: holm, alpha: 0.05, family: [H1, H2, H3, RQ1, RQ3, RQ4]}
real_networks: [hospital]   # datasets used in every analysis; add names here as more are prepared
synthetic_instances: 3      # per cell of the 27-cell design, 81 networks (syn<i> with i % 10 < 3)
